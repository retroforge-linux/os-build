# retroforge release update bundle — builds a RAUC bundle for a device already in the field.
#
# Separate from release-sdcard.yml on purpose: an update ships on its own cadence, and coupling it to
# card builds would mean either cutting cards nobody asked for or delaying updates until someone did.
# Both delegate to image.yml so the rootfs recipe exists once.
#
# ============================================================================================
# A TAG PRODUCES A SIGNED, SHIPPABLE BUNDLE. A DISPATCH PRODUCES AN UNSIGNED SMOKE TEST.
# ============================================================================================
# A device installs a bundle only if its signature chains to the keyring baked into its own image.
# Pushing `ota/v*` runs the build inside a PROTECTED environment where the release key is reachable;
# anything else builds with an ephemeral dev cert, which proves the bundle assembles, the verity
# hashes compute, the manifest is well formed and the pin gate passed — and which every device
# rejects. That is the intended difference, not a limitation.
#
# WHICH KEY ACTUALLY GOES TO CI, because this was mis-stated for a while and it matters. Not the
# 20-year root: ~/retroforge-pki/ca.key.pem stays offline and never leaves the workstation. CI gets
# release.cert.pem + release.key.pem — the SIGNING pair, whose cert expires 2028-12-21. Devices
# trust the CA, not that cert, so if CI is ever compromised the response is to mint a new release
# cert from the offline root and carry on. No device changes, no keyring update, no reflash. That
# is a materially smaller decision than "put the root of trust in GitHub", which is what the old
# wording here described.
#
# SETUP, once per repo (nothing below works until this is done — the build silently falls through
# to the dev cert, which is the safe direction):
#
#   1. Create a PROTECTED environment (repo settings -> Environments) named `release-signing`, with
#      required reviewers and a branch/tag restriction. The environment is what makes signing an
#      APPROVED action rather than an available one. Override the name with the SIGNING_ENVIRONMENT
#      repo variable if you want a different one.
#   2. Add RAUC_CERT_PEM + RAUC_KEY_PEM, and the R2_* secrets the publish step reads, to THAT
#      environment, with the R2_BUCKET and R2_PUBLIC_BASE variables. Not repo-wide — repo-wide
#      secrets reach every workflow_dispatch.
#
#   ON THIS REPO TODAY (public since 2026-11; environments are free on public repos): done, with the
#   secrets and variables in `release-signing`, a deployment policy of `ota/v*` tags only, and a
#   required reviewer (2026-11-09), so the `release` job waits for that single approval.
#
#   3. Nothing else. image.yml takes an `environment` input and declares it on its build job (a
#      caller cannot attach an environment to a reusable workflow's job from outside), and the
#      `build` job below passes it only on a tag.
#
# VERIFIED 2026-08-11: `environment: ''` means "no environment" rather than an error. Every card run
# has taken that path since release-sdcard.yml was written, and the `build` job below now takes it
# unconditionally — a build that names no environment is the entire point of the split. (Recorded
# here as UNVERIFIED until the split made it load-bearing for bundles too. Had it failed, the fix
# would have been two jobs in image.yml picked with an `if:`, not a change to the model.)
# WHERE THE BUNDLE GOES: the Cloudflare R2 bucket devices update from, since 2026-10-13 (it replaced
# a self-hosted nginx box). Not a GitHub release asset like the card and installer: a card is
# downloaded by a person with a browser, a bundle is fetched by a device with a keyring, which needs a
# stable public url and Range support (rauc streams the bundle). The transport is
# ota/publish-bundle.sh, called by the `release` job below (sign-publish-bundle.yml); the bucket layout is
# <channel>/latest.json + <channel>/retroforge-<version>.raucb under R2_PUBLIC_BASE, which is what
# retroforge-update reads. R2_PUBLIC_BASE is https://ota.retroforge.org, the same url devices carry
# as retroforge-update's DEFAULT_URL (images before 2026-10-13 carry a placeholder and see nothing).
#
# PUBLISHING runs on a tag only, and fails closed twice over:
#
#   1. publish-bundle.sh verifies the bundle against the CA in every device's keyring BEFORE it
#      moves a byte. A dispatch can only produce dev-cert bundles, so the publish steps do not run
#      at all on one — they would exist solely to reject their own artifact.
#   2. It refuses a bundle whose payload was built as a DEV image, which a signature check cannot
#      distinguish from a shippable one (see publish-bundle.sh's second gate).
#
# A missing credential is a hard error, never a skipped step: before 2026-08-04 a missing key was a
# `::notice::` at the bottom of a green run, and `ota/v0.2.1` was cut, built, signed and published
# nowhere. The only two states are "published" and "red".
#
# THE REPO IS PUBLIC (since 2026-11), so its fork pull requests run ci.yml — with a read-only
# token and no secrets, which is why nothing here triggers on pull_request or pull_request_target.
# The RAUC_* and R2_* secrets are ENVIRONMENT-scoped in `release-signing`, reachable only by a job
# that names it, and the environment only accepts deployments from `ota/v*` tags.
name: release bundle

# TAG NAMESPACE: `ota/v*`. Bundles and cards ship on independent cadences — an update goes out far
# more often than a card — so each gets its own namespace instead of sharing a bare `v*`. Until this
# trigger existed, release-sdcard.yml owned `v*` alone, so tagging a release built a CARD and never
# a bundle: exactly backwards. `ota/v1.3.0` and `card/v1.3.0` on one commit are the same OS shipped
# two ways; a run of ota tags with no card between them is the normal state.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (default: empty — the image stamps itself `dev` and the bundle is named after its build timestamp)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'ota/v*'

permissions:
  contents: read

jobs:
  # Same reason release-sdcard.yml has one: GitHub expressions cannot strip the `ota/` prefix, so the
  # version is derived in a shell step and image.yml keeps taking a bare version string.
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${REF_NAME#ota/}"
          else
            # Empty is legitimate here, unlike the card path: the image then calls itself `dev` and
            # genbundle.sh names the bundle after its build timestamp, which is still unique per
            # build. A dispatch with no version is a smoke test, and it is labelled as one.
            v=""
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # ============================================================================
          # WHICH CHANNEL THIS TAG PUBLISHES TO: the semver PRE-RELEASE suffix, and
          # nothing else. `ota/v0.3.0` -> stable. `ota/v0.3.0-beta.1` -> beta.
          # ============================================================================
          # The channel is the first path segment in the bucket, and it is what a
          # device's OTA_CHANNEL selects — the environment, then /etc/retroforge/ota.conf,
          # then the user-writable ~/.config/retroforge/ota.conf (retroforge-update's
          # channel_setting()), which the shell's Settings > General > Updates channel
          # dropdown writes. So this line is what gives that dropdown something to point
          # at; without a beta directory on the server, choosing Beta is a 404 and the
          # device's update check quietly reports "no update found" forever.
          #
          # NOT A SEPARATE TAG NAMESPACE (`ota-beta/v*`), which is the obvious alternative
          # and the shape the ota/ + card/ split would suggest. The suffix wins because the
          # VERSION STRING ITSELF then records the channel, and duplicate detection turns on
          # that string: retroforge-update's check compares the offered identity against the
          # running one for INEQUALITY, so two channels publishing the same `0.3.0` would
          # leave a device that switches stable -> beta believing it is already up to date.
          # `0.3.0` and `0.3.0-beta.1` are distinct identities by construction, and the
          # version the user reads in Settings says which channel they are on.
          #
          # A beta bundle is signed with the SAME release key and gated exactly as hard --
          # the keyring and the dev-image refusal in ota/publish-bundle.sh are not relaxed
          # here. The channel decides who is offered it, not whether it is trustworthy.
          #
          # Retention is per-channel for free: publish-bundle.sh writes to $DOCROOT/$CHANNEL
          # and prunes within it, so a run of betas can never evict the stable release a
          # device on `rel` is still being offered.
          #
          # A `-nightly` suffix is REFUSED here: nightly-bundle.yml alone publishes to `nightly`, from
          # main on a schedule, signed by the nightly cert in `nightly-signing`. Without this line an
          # `ota/v0.0.8-nightly.1` tag would match `*-*` below and go to beta under the release key.
          case "$v" in
            *-nightly*)
              echo "::error::'$v' is a nightly version; nightly builds come from nightly-bundle.yml, never from an ota/ tag"
              exit 1 ;;
            *-*) channel=beta ;;
            *)   channel=stable ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "::notice::version '${v:-<dev>}' publishes to the '$channel' channel"

  # ============================================================================================
  # build -> release (sign + publish). THE BUILD HOLDS NO KEY AND NAMES NO ENVIRONMENT, so it
  # starts the moment the tag lands instead of queueing behind a reviewer.
  # ============================================================================================
  # Assembling a rootfs needs no release key, so gating the build would only park a 30-minute job
  # in `waiting` — and burn an approval every time an upstream outage (kernel.org, github.com
  # mid-clone) kills it. The gate sits on `release`, where the keys are actually used, so a reviewer
  # approves a build that has already succeeded — the same shape as the card path, whose upload
  # lives outside its build job (see image.yml's header).
  #
  # `secrets: inherit` stays, and stays safe for the same reason as before: the signing secrets are
  # ENVIRONMENT-scoped, and this job names no environment, so it inherits nothing that matters. It is
  # now belt-and-braces rather than load-bearing — `artifact: rootfs` has no step that would use a
  # key even if one were reachable.
  build:
    needs: prep
    uses: ./.github/workflows/image.yml
    secrets: inherit
    with:
      artifact: rootfs
      version: ${{ needs.prep.outputs.version }}
      environment: ''

  # SIGNED AND PUBLISHED ON A TAG PUSH, dev-signed and kept on a dispatch. A tag push is the
  # deliberate act — someone decided this commit ships — and it is the only path that names the
  # protected environment, so it is the only path where the release key and the R2 credentials are
  # reachable at all. A bare workflow_dispatch is a smoke test: it proves the bundle assembles, signs
  # it with an ephemeral dev cert every device rejects, and skips the publish steps.
  #
  # The steps live in sign-publish-bundle.yml (moved there 2026-11-12; it adds only input checks) so nightly-bundle.yml
  # signs and publishes with the same recipe; that file carries the step-by-step reasoning.
  #
  # `prep` for the CHANNEL only. A job cannot reference the outputs of one it does not declare a need
  # on, and the reference would resolve to the EMPTY STRING rather than failing — which the called
  # workflow refuses, but only after the build. Nothing here reads prep's VERSION, deliberately: the
  # bundle's identity comes out of the rootfs it wraps.
  #
  # `publish` is event_name AND ref_type, because a workflow_dispatch can be started ON a tag
  # (ref_type 'tag'), and its version and channel then come from a free-text input, not the tag.
  release:
    needs: [prep, build]
    uses: ./.github/workflows/sign-publish-bundle.yml
    secrets: inherit
    with:
      channel: ${{ needs.prep.outputs.channel }}
      publish: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      environment: ${{ vars.SIGNING_ENVIRONMENT || 'release-signing' }}

  # A GitHub Release for the update, NOTES ONLY. The bundle itself lives in R2 and reaches devices
  # through latest.json; this is the human-readable record of what the update changed, next to the
  # card releases. After `release`, so a Release never announces an update the fleet cannot get.
  #
  # Not the "Latest" release: that badge belongs to the newest card, which is what someone arriving
  # at the releases page wants to download. A beta update is marked as a pre-release.
  #
  # The notes are written by Cloudflare Workers AI from the commits since the previous ota/ tag (a stable
  # release compares against the previous stable one); .github/scripts/release-notes.sh falls back to
  # the plain commit list on any Workers AI failure, so this job does not fail on the summary.
  notes:
    needs: [prep, release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: write the release notes
        env:
          # Cloudflare Workers AI, the account that holds the OTA bucket (see the script's header).
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/changes.md"

      - name: cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prep.outputs.version }}
          CHANNEL: ${{ needs.prep.outputs.channel }}
        run: |
          set -euo pipefail
          {
            echo "## RetroForge $VERSION update"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo '### Install'
            echo
            echo "Devices on the \`$CHANNEL\` channel are offered this update in Settings > General > Updates."
            echo 'To set up a new device, flash the latest card release instead.'
          } > notes.md
          pre=()
          [ "$CHANNEL" = stable ] || pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest=false \
            "${pre[@]}" \
            --title "RetroForge $VERSION update" \
            --notes-file notes.md
