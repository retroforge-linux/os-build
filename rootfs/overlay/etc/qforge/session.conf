# qforge gamescope-session configuration (sourced by /usr/bin/qforge-session, sh syntax).

# QFORGE_SESSION_CMD — the shell launched inside gamescope: OpenGamepadUI
# (packages/opengamepadui). /usr/bin/opengamepadui is upstream's launcher; it sees gamescope already
# running (its socket under $XDG_RUNTIME_DIR) and execs the shell directly instead of starting a
# gamescope of its own. For a display-path liveness check without the shell, use "vkcube --wsi xcb".
#
# --skip-update-pack: OGUI's self-updater (Settings > General) downloads upstream's `update.zip`
# into ~/.local/share/opengamepadui/updates, and at every start entrypoint.gd unpacks it and runs
# `opengamepad-ui.x86_64` from it as a supervised child. That asset is the x86_64 build, so on this
# device the child cannot exec and the supervisor quits: a black panel until the user deletes a
# directory they cannot reach. Even a matching-arch build would override the OS image's OGUI, which
# on a read-only RAUC root is what carries the shell version. The flag skips the unpack-and-exec
# step entirely; the download itself can still happen, but is never used.
QFORGE_SESSION_CMD="opengamepadui --skip-update-pack"

# QFORGE_GAMESCOPE_SHELL_ARGS — gamescope flags the shell needs on top of the base set. OGUI drives
# gamescope through the Steam-mode X atoms (GAMESCOPECTRL_BASELAYER_APPID, STEAM_OVERLAY,
# STEAM_INPUT_FOCUS, ...), which gamescope only honours with --steam, on two nested Xwaylands
# (shell + game). The same flags upstream's own OGUI session passes.
QFORGE_GAMESCOPE_SHELL_ARGS="--steam --xwayland-count 2"

# Environment upstream's OGUI session sets for everything gamescope hosts. Exported here because
# session.conf is sourced by qforge-session before gamescope and the shell start, so both inherit it.
#   QT_QPA_PLATFORM=xcb                 Qt apps (emulator frontends) on Xwayland, like the shell.
#   SDL_VIDEO_MINIMIZE_ON_FOCUS_LOSS=0  an SDL game must not minimize when the shell's overlay takes
#                                       focus, or it vanishes behind the quick menu.
#   vk_xwayland_wait_ready=false        Mesa's Xwayland WSI must not block on a frame-ready event
#                                       gamescope's nested Xwayland does not deliver promptly.
export QT_QPA_PLATFORM=xcb
export SDL_VIDEO_MINIMIZE_ON_FOCUS_LOSS=0
export vk_xwayland_wait_ready=false

# QFORGE_GAMESCOPE_EXTRA — extra gamescope flags appended after the HW-validated base set
# (--backend drm -W <w> -H <h> -r <hz>; panel rotation is auto-detected from the DRM connector
# orientation, no flag). Normally empty.
QFORGE_GAMESCOPE_EXTRA=""

# Rotation path, and it MUST stay board-conditional. The DPU SSPP inline rotator caps the
# PRE-ROTATION source at 1088 lines. gamescope's logical canvas is the panel's native mode swapped
# to landscape, so that source height is exactly the panel's native WIDTH — which is why the test
# below reads _WIDTH and not _HEIGHT.
#
# The plane advertises ROTATE_90 unconditionally (it is a static capability the driver cannot
# qualify per-mode), so on a panel over the cap gamescope believes it can rotate at scanout, stops
# rotating in its own composite step, and then every flip is rejected -- "invalid height for
# inline rot:1440 max:1088" -- and nothing is ever scanned out. That is a BLACK SCREEN, not a slow
# one.
#
# HW-measured 2026-09-12, all three boards on one card:
#     Pocket ACE  1080x1620  native width 1080  -> scanout rotation, 0 flip errors
#     Pocket FIT  1080x1920  native width 1080  -> scanout rotation, 0 flip errors
#     Pocket S2   1440x2560  native width 1440  -> over the cap
# The cap is on the PER-PIPE source, so a plane split in two would halve it; the split needs
# >138 Hz on the S2's timing (514 MHz max MDP core clock / (1440 x 2585)), and it runs at 60.
# If that panel ever gains a high-refresh mode, re-measure before assuming this still applies.
#
# We render the session slightly smaller instead of rotating in the compositor. The clamped output
# is short enough for the rotator, and the same plane scales it back up to the panel for free, so
# a board over the cap keeps scanout rotation instead of paying a GPU composite on every present.
# HW-measured on Pocket S2, 2026-09-12 (patched gamescope, PGRC at 720p):
#     --force-composition-rotation   idle UI composites every frame;  in game 21% GPU, 4290 mW
#     --rotated-output-max-height    idle UI 0 ms GPU, 3925 mW;       in game  0% GPU, 3456 mW
# i.e. -834 mW (-19%) in game, and the operator could not tell the upscaled UI from native.
# Quitting a game back to the UI -- which hard-wedges the display when neither flag is set -- keeps
# scanning out. Cost: the UI renders at 1080p upscaled to the 1440p panel, and games cap at 1080p.
#
# !! --rotated-output-max-height EXISTS ONLY IN OUR PATCHED GAMESCOPE !!
# packages/gamescope/patches/0001-drmbackend-rotated-output-max-height.patch. An unknown argument
# makes gamescope EXIT rather than ignore it, so if that patch is ever dropped (an upstream bump
# that absorbs or rejects it), this line must go back to "--force-composition-rotation" in the same
# commit -- otherwise every board over the cap fails to start a session at all.
#
# `if` and NOT `[ ... ] && ...`: qforge-session runs under `set -eu` and SOURCES this file, so a
# false `&&` test as the last statement would return non-zero and abort the whole session.
# A landscape-native panel (QFORGE_PANEL_ORIENTATION=landscape, the Air Y Pro's 1280x960) is never
# rotated at scanout, so the rotator cap does not apply to it however wide it is.
if [ "${QFORGE_PANEL_ORIENTATION:-portrait}" != landscape ] && [ "${QFORGE_PANEL_NATIVE_WIDTH:-0}" -gt 1088 ]; then
    QFORGE_GAMESCOPE_EXTRA="--rotated-output-max-height 1080"
fi

# Composite with a fragment pass instead of compute. It changes HOW gamescope composites, never
# WHETHER: scanout-capable frames still go straight to the planes. The output becomes a colour
# attachment instead of a storage image, so it can stay UBWC -- which turnip refuses for storage
# images before a7xx -- and on a tiler the rotation to the panel is free.
# HW-measured on Pocket Max (SM8250), 2026-09-28, Trine, GPU pinned at 800 MHz: gamescope
# 3.11 -> 2.72 ms per composite (-12%), output 0x0 -> UBWC. Frame rate did NOT move -- any composite
# locks Trine near 40 fps against 58 on direct scanout -- so this trims the cost of composites that
# happen anyway (a non-default colour temperature forces one on SM8250, issue #106).
# !! --composite-graphics EXISTS ONLY IN OUR PATCHED GAMESCOPE (patches/0019) !! Same rule as
# above: an unknown argument makes gamescope exit, so drop this line with the patch.
QFORGE_GAMESCOPE_EXTRA="$QFORGE_GAMESCOPE_EXTRA --composite-graphics"

# Pre-rotation (what ROCKNIX calls DEVICE_PRE_ROTATION). Where the panel is rotated and a plane
# cannot rotate a layer, gamescope copies that layer into a panel-oriented buffer with a
# VK_QCOM_rotated_copy_commands blit and scans the copy out on an unrotated plane -- the overlays
# first so the base keeps a rotating pipe, then every layer -- instead of compositing the whole
# frame on the GPU (patches/0027 + 0028). A frame that is composited anyway and is a single
# unscaled sRGB layer is copied by the transfer engine rather than drawn by the composite shader.
# With the flag off nothing changes: the blits exist only with it, and a board whose plane
# rotates every layer (the SM8xxx boards above) never reaches them. Colour management survives
# it: a blitted frame is colour managed by the DPU exactly like a direct scanout, and the blit is
# declined wherever the DPU cannot carry the transform (patches/0030), so night mode is not
# silently dropped the way issue #106 / patches/0014 describe.
# !! --composite-blit EXISTS ONLY IN OUR PATCHED GAMESCOPE (patches/0027) !! Same rule as above.
# Not wired here: the Mesa half of pre-rotation (packages/mesa/patches/0002-0013) is for a
# compositor whose CLIENTS present straight to the display and is driven by vk_wsi_wayland_prerotate
# / egl_wayland_prerotate (ROCKNIX prerotate_env: DTS rotation 90 -> 270, 270 -> 90, 180 -> 180,
# only when the plane does not rotate). gamescope's clients render unrotated and gamescope blits,
# so those variables stay unset in this session; they are for a KWin/sway session.
QFORGE_GAMESCOPE_EXTRA="$QFORGE_GAMESCOPE_EXTRA --composite-blit"

# SM6115 (MANGMI Air X): the plane is never asked to rotate. ROCKNIX ships this SoC with
# DEVICE_PLANE_ROTATION=false, i.e. --force-composition-rotation under gamescope, and we follow
# it rather than let liftoff probe the plane every frame. With --composite-blit above that means
# every client layer is pre-rotated by a blit and scanned out on an unrotated plane, which is the
# cheap path on an A610 -- a full GPU composite per present is what it replaces. The Air Y is
# SM6115 too but its panel is landscape-native (QFORGE_PANEL_ORIENTATION=landscape), so there is
# nothing to rotate; the flag would be a no-op there and is gated out anyway. QFORGE_SOC_CLASS
# comes from device-env. Same `if`-not-`&&` rule as the rotator-cap block above.
if [ "${QFORGE_SOC_CLASS:-}" = SM6115 ] && [ "${QFORGE_PANEL_ORIENTATION:-portrait}" != landscape ]; then
    QFORGE_GAMESCOPE_EXTRA="$QFORGE_GAMESCOPE_EXTRA --force-composition-rotation"
fi

# SM6115's Adreno 610 has no hardware multiview, and turnip only advertises what gamescope needs
# (Vulkan 1.3, multiview-dependent features) when told not to insist on conformance:
# tu_device.cc gates on `has_hw_multiview || TU_DEBUG(NOCONFORM)`. Without this the Air X's first
# boot ended in "vulkan: failed to find physical device" from gamescope, every 20 s. ROCKNIX sets
# the same variable for SM6115 and SM4450 ("Enable Vulkan 1.3 support") and nothing else. The
# session's environment is inherited by gamescope and everything it launches, so games get it too.
if [ "${QFORGE_SOC_CLASS:-}" = SM6115 ]; then
    export TU_DEBUG=noconform
fi

# QFORGE_GAMESCOPE_W / _H — the LANDSCAPE logical output size gamescope renders at (the panel's
# portrait native mode swapped to landscape). Leave UNSET to auto-detect from the connected DSI
# connector at runtime (falls back to 1920x1080). Pin only to override detection.
#QFORGE_GAMESCOPE_W=1920
#QFORGE_GAMESCOPE_H=1080

# QFORGE_GAMESCOPE_REFRESH — output refresh in Hz (-r). sysfs does not expose the native rate, so
# this is a plain default (60); gamescope clamps to the panel's nearest supported mode.
#QFORGE_GAMESCOPE_REFRESH=60

# QFORGE_GAMESCOPE_OUTPUT — DRM connector to scan out (--prefer-output, e.g. DSI-1). Leave UNSET to
# auto-pick the largest connected DSI panel at runtime. Override to force a specific connector.
#QFORGE_GAMESCOPE_OUTPUT=DSI-1

# GAMESCOPE_DEBUG_FOCUS — focus-selection diagnostic. Turns on gamescope's debug_focus_candidates
# convar (packages/gamescope/patches/0006), which logs why each window is or is not a focus
# candidate, which one wins, and its commit-queue state — keep it for the next focus bug.
# Sourced by qforge-session, so `export` here is what reaches gamescope — which is the only way to
# have it on at BOOT, before SSH is up and `gamescopectl debug_focus_candidates 1` is reachable.
# Output goes to the journal (`journalctl -b -u qforge-session`); grep it for `cand:`.
# Diagnostic only. The patch it depends on (patches/0006) is deliberately NOT in source.pin, so on a
# stock build this variable does nothing — re-add 0006 to source.pin first, then uncomment here.
#export GAMESCOPE_DEBUG_FOCUS=1
