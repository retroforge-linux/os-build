# Lets Wine (Proton) give a game's threads the priorities the game asks for, as on Valve's SteamOS
# (its 15-proton-nice.conf). wineserver raises its soft RLIMIT_NICE to this hard limit and maps
# Windows priorities onto nice -8..8; with the default hard limit of 0 it sets none. Megabonk under
# Proton on the KONKR Pocket FIT Elite: its audio thread at -8, its main threads at -1/-2, and its
# background and shader-compile threads at +3 (2026-11-28).
# pam_limits (system-auth) applies it to the session and to the user manager, so Steam, OGUI and
# store games all get it. No process of the player's can go below nice -8.
*               hard    nice            -8
