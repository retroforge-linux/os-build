Syntax 4

# MANGMI Air Y (SM6115). Card model = "MangmiAirY" (kernel/dts/qcom/sm6115-mangmi-air-y.dts); the card driver
# is sm8250.c's qrb4210-rb2 entry, whose short name is sm4250, so the conf.d symlinks live under
# conf.d/sm4250/. Legacy q6asm/ADM path: speakers on SEC_MI2S through one AW88261 amp (mono),
# headphones and headset mic on QUAT_MI2S through the ES8326, built-in mic on the VA macro DMIC2.
#
# Ported 2026-10-09 from ROCKNIX `next` (ucm2/Qualcomm/sm6115/MangmiAirY.conf +
# HiFi-MangmiAirY.conf). ROCKNIX sets the amp profile, the gains and the HP/SPK volume switch in a
# BootSequence; nothing on the shipped image executes one (see the Pocket Max profile for the
# history), so those moved into the HiFi verb's device EnableSequences. Not yet heard on the board.
#
# Sample format: the back ends are pinned to S16_LE (kernel/patches/0871) and UCM has no key for
# it, so usr/share/wireplumber/wireplumber.conf.d/51-mangmi-air-x-y.conf forces the PCMs to S16LE.

Comment "MANGMI Air Y"

SectionUseCase."HiFi" {
	File "/Qualcomm/sm6115/MangmiAirY/HiFi.conf"
	Comment "Speakers, headphones and microphones"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
