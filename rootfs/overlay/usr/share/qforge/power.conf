# qforge-powerd factory config. Layered: this file, then /etc/qforge/power.conf (operator), then
# /etc/qforge/power.conf.d/*.conf in sorted order (powerd writes 50-fan-curves.conf there).
#
# Power profiles, CPU/GPU frequency limits, core count and boost belong to PowerStation and
# OpenGamepadUI's performance menu (a profile there is a CPU + GPU governor pair). What is left
# here is what only powerd does: the boot governor, the fan, and the fan during suspend.

[cpu]
# Replaces the kernel's boot governor (performance) on every cpufreq policy, ONCE per boot; after
# that the governors are the power profile's. ondemand measured the better frame-time consistency
# on these SoCs (kernel/kernel.config, "CPU frequency governors"), and it is what PowerStation's
# "balanced" profile sets, so keep the two in step.
governor=ondemand
# Energy-aware scheduling (kernel.sched_energy_aware), re-applied after every governor change.
# off: the kernel switches EAS on with schedutil on a big.LITTLE CPU, and EAS packs game threads
# onto the little cores -- 95% missed frames on the Air X (SM6115) against 1-2% with it off.
energy_aware=off

[fan_curve.relaxed]
label=Relaxed
curve=98:255,94:204,88:153,82:102,76:77,0:51

[fan_curve.moderate]
label=Moderate
curve=96:255,90:204,84:153,78:102,72:77,0:51

[fan_curve.aggressive]
label=Aggressive
curve=90:255,85:204,80:153,74:102,66:77,0:51

[fan]
# A [fan_curve.<name>] above, or temp:pwm points inline. moderate was the balanced profile's.
curve=moderate
min_pwm=51
max_pwm=255
ramp_up=36
ramp_down=6
smoothing=0.50
pwm_quantum=8
# The temperatures the editable curve is sampled at (org.qforge.Power1 FanCurve). Only the
# PWMs are user-editable, so a curve that falls as it heats up is unreachable rather than
# rejected. They bracket where the factory curves actually do their work (first knee 66-76,
# full tilt 90-98); a curve set over D-Bus lands in power.conf.d/50-fan-curves.conf.
curve_stops=60,70,80,90,100

[suspend]
fan_off_below=45
fan_on_above=50
fan_safe_above=55
fan_low_pwm=51
fan_safe_pwm=128
