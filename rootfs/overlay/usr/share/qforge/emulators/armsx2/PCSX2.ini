; QForge first-run settings for ARMSX2 (a PCSX2 fork: same file, same keys). qforge-launch copies
; this to ~/.config/ARMSX2/inis/PCSX2.ini only when that file does not exist, so whatever the
; player changes in ARMSX2 afterwards is kept.
;
; Every handheld reaches emulators as ONE controller: InputPlumber turns each device's joypad into
; a virtual Xbox Elite pad (/etc/inputplumber/devices.d), which SDL sees as SDL-0. So this mapping
; is the same on every device.
;
; Only what QForge decides is here; ARMSX2's own defaults cover every key left out.
; - SettingsVersion = 1: REQUIRED. Without it (or with another value) ARMSX2 treats the file as
;   broken, asks "reset all settings to defaults?" and, on yes, overwrites everything below
;   (VMManager::Internal::CheckSettingsVersion, SETTINGS_VERSION = 1 at nightly-20261005).
; - SetupWizardIncomplete = false: no setup wizard before the game. Skipping it also skips its
;   controller auto-map, hence [Pad1] below.
; - ConfirmShutdown = false: no "are you sure?" when the game is closed, including by
;   OpenGamepadUI's Exit (SIGTERM); a dialog nobody answers would hold the exit (DuckStation did).
; - SaveStateOnShutdown = true: a resume state in ~/states/ps2 when the game is closed, as for
;   DuckStation.
; - AutoUpdater off: QForge pins the version; ARMSX2 must not offer its own.
; - No [EmuCore/GS] Renderer: Automatic picks Vulkan on Turnip by itself. Forcing it (14) put a
;   "Graphics API is not set to Automatic" warning on screen at every start (HW 2026-10-05).
; - [EmuCore/GS] VsyncQueueSize = 1 (default 2): the EE may run at most one frame ahead of the GS
;   thread, so a button press is drawn one frame sooner when the GS is the slow side. Measured on
;   the Air X (God of War, heavy scene, EE-bound): 2 -> 31.3 fps, 1 -> 31.4, 0 -> 29.0 (0 serialises
;   EE and GS and costs ~7%).
; - BIOS: no file is named, so ARMSX2 picks one from ~/bios/ps2 itself (LoadBIOS -> FindBiosImage).
; - OpenPauseMenu: Select + Start, as for DuckStation. Guide stays unbound: OpenGamepadUI owns it.
; - Memory cards and save states go to the shared layout (~/saves/ps2, ~/states/ps2:
;   usr/share/user-tmpfiles.d/qforge-home.conf), so they are reachable over the network share.

[UI]
SettingsVersion = 1
SetupWizardIncomplete = false
ConfirmShutdown = false
HideMouseCursor = true

[AutoUpdater]
CheckAtStartup = false

[EmuCore]
SaveStateOnShutdown = true

[EmuCore/GS]
VsyncQueueSize = 1

[Folders]
Bios = /home/player/bios/ps2
MemoryCards = /home/player/saves/ps2
Savestates = /home/player/states/ps2

[GameList]
RecursivePaths = /home/player/roms/ps2

[InputSources]
SDL = true

[Pad1]
Type = DualShock2
Up = SDL-0/DPadUp
Right = SDL-0/DPadRight
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Triangle = SDL-0/FaceNorth
Circle = SDL-0/FaceEast
Cross = SDL-0/FaceSouth
Square = SDL-0/FaceWest
Select = SDL-0/Back
Start = SDL-0/Start
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/+LeftTrigger
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LUp = SDL-0/-LeftY
LRight = SDL-0/+LeftX
LDown = SDL-0/+LeftY
LLeft = SDL-0/-LeftX
RUp = SDL-0/-RightY
RRight = SDL-0/+RightX
RDown = SDL-0/+RightY
RLeft = SDL-0/-RightX
LargeMotor = SDL-0/LargeMotor
SmallMotor = SDL-0/SmallMotor

[Hotkeys]
OpenPauseMenu = SDL-0/Back & SDL-0/Start
