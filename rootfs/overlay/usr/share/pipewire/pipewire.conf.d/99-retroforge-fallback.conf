# A silent node owned by the PipeWire daemon, so a sink still exists while WirePlumber (which owns
# every ALSA node) restarts or crashes, or the sound card drops out. OpenGamepadUI's Godot PulseAudio
# driver reopens its stream whenever the default sink's name changes and ends its audio thread for
# good if that sink is missing, which left the shell silent until the session restarted. With this
# node it moves here and back: sound kept through three WirePlumber restarts (HW, RG 55G1, 2026-11-07).
# Priority 1 keeps it below every real sink.
#
# Audio/Sink, not Audio/Duplex (#45). A Duplex node is a sink AND a source to PulseAudio clients, both
# named retroforge-fallback, and on a board with no mic WirePlumber made it the default source. SDL3's
# PulseAudio driver then opened its default playback on the sink of that name: Flycast (and any
# SDL3 / sdl2-compat app) played into this silent node. WirePlumber never makes an Audio/Sink the
# default source, and its monitor is retroforge-fallback.monitor, so no sink shares a default
# source's name. OpenGamepadUI's output menu lists every Audio/Sink: its patch 0052 leaves this one out.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = retroforge-fallback
            node.description = "Fallback"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            priority.session = 1
            priority.driver  = 1
        }
    }
]
