# MANGMI Air X / Air Y (SM6115) — force S16LE on the cards' PCMs.
#
# The counterpart to Qualcomm/sm6115/MangmiAirX and MangmiAirY HiFi.conf, and the same reasoning
# as 51-ayn-thor-lite.conf: the qdsp6 routing path opens its ADM COPP as a bit-exact passthrough,
# and the MI2S back ends are pinned to S16_LE by kernel/patches/0871 (the ES8326 and AW88261 take
# nothing else), so the MultiMedia front-end PCMs must be opened S16LE too or output is noise.
# ROCKNIX does the same for every ALSA node on this SoC (90-sm6115-s16le.conf); scoped here to the
# two cards by alsa.card_name, the `model` of each sound node. SPA-JSON, WirePlumber 0.5+.

monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card_name = "MangmiAirX"
      }
      {
        alsa.card_name = "MangmiAirY"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
