# RetroForge first-run settings for DSperate (beebono/DSperate v3.4.1). retroforge-launch copies this
# to ~/.config/dsperate/dsperate.ini only when that file does not exist, so whatever the player changes
# in DSperate afterwards is kept (its pause menu edits single lines here, src/frontend/sdl/config.cpp
# Config::store). Only what RetroForge decides is here; DSperate's defaults cover the rest
# (configs/default.ini in its source lists every key). Comments stay on their own lines: DSperate
# cuts a value at the first # or ;.
# - [video] layout dominant_h: the top screen as large as a whole scale allows, the touch screen beside
#   it in the room left (melonDS's emphasized side-by-side layout before). Guide+Y cycles the layouts
#   and Guide+L2 swaps which screen is large; a layout picked that way is remembered per game in
#   ~/.config/dsperate/games/<rom>.ini. --fullscreen comes from emulator.json's args. screen = top: on
#   a dual-screen board, the DS top screen on the upper panel.
# - The same file on every board. One window per panel is the launcher's --dual-window (emulator.json
#   dual_screen_args), passed only when the game's Xwayland shows both panels: a seeded dual_window
#   makes DSperate exit at start when SDL counts one display, with no flag to turn it off.
# - [paths] the flat ~/bios: a missing dump falls back to DSperate's FreeBIOS and generated firmware,
#   so games boot with no files. Battery saves in ~/saves/nds (<rom>.sav, melonDS's names), states in
#   ~/states/nds (screenshots too), unpacked .zip games in ~/.cache/dsperate instead of a hidden
#   .dsperate folder in ~/roms/nds. games: the list DSperate's loader card shows on a firmware boot.
# - [hotkeys] the Guide layer (guide-hotkeys.yaml next to emulator.json) sends keys: F1 load state,
#   F2 save state, F3 fast-forward (held), F4 quit (battery save written), F5 next layout, F6 swap
#   screens, P the pause menu (Guide+Select), M the microphone (Guide+R3, held). DSperate's own F2/F3
#   (slot), F4 (layout) and F5/F7 (states) defaults move or go so nothing collides.
# - [padhotkeys] all off: DSperate's pad hotkeys hang off Guide, which OpenGamepadUI owns (it never
#   reaches the game), and its mic default is L3 alone, too easy to click. The stylus stays on the
#   right stick (R3 touches), DSperate's default.
# - [cheevos] is written at every launch from RetroForge's one sign-in (emulator.json achievements).

[video]
layout = dominant_h
screen = top

[paths]
bios9 = /home/player/bios/bios9.bin
bios7 = /home/player/bios/bios7.bin
firmware = /home/player/bios/firmware.bin
games = /home/player/roms/nds
saves = /home/player/saves/nds
states = /home/player/states/nds
cache = /home/player/.cache/dsperate

[hotkeys]
load_state = F1
save_state = F2
fast_forward = F3
quit = F4
layout_next = F5
screen_swap = F6
pause = p
mic = m
slot_next = none
slot_prev = none

[padhotkeys]
quit = none
pause = none
fast_forward = none
save_state = none
load_state = none
slot_next = none
slot_prev = none
layout_next = none
layout_prev = none
screen_swap = none
mic = none
