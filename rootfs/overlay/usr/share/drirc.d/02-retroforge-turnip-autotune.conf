<?xml version="1.0"?>
<!--
  Our Turnip autotune (mesa patches 0017-0019) for every program, on every board. Mesa reads drirc.d
  in name order, so these settings come after its 00-turnip-defaults.conf. The OS image also lays this file
  into the FEX x86 guest's drirc.d (rootfs/lib-assemble-x86-mesa.sh), so native x86 games
  get it from our x86 Mesa.

  tu_autotune_flags: adapt corrects the GMEM/sysmem time model from measured render pass times
  (0018). TU_AUTOTUNE_FLAGS in the environment replaces it.

  tu_autotune_algorithm for DXVK and vkd3d-proton: upstream's 00-turnip-defaults.conf hardcodes
  prefer_sysmem for both ("DX games almost always tend to prefer SYSMEM"). With that setting, every pass of
  theirs renders to system memory and our autotune never runs. bandwidth is our autotune, the one
  every other Vulkan program gets: 0017 picks GMEM or sysmem per pass from the GPU's cost row
  and 0018 corrects that choice. On the A610 it does better for DX games: the Among Us menu went
  from 18.4 to 16.0 ms of GPU time per frame (54.8 -> 60 fps), Hollow Knight from 47.2 to 47.0 ms,
  and Mega Man Legacy Collection was unchanged (MANGMI Air X, DXVK-Sarek, interleaved runs,
  2026-11-26). Other GPUs were not measured. TU_AUTOTUNE_ALGO in a game's environment still wins,
  e.g. prefer_sysmem for a game that does worse.
-->
<driconf>
    <device driver="turnip">
        <application name="all-default">
            <option name="tu_autotune_flags" value="adapt"/>
        </application>
        <engine engine_name_match="DXVK|vkd3d">
            <option name="tu_autotune_algorithm" value="bandwidth"/>
        </engine>
    </device>
</driconf>
