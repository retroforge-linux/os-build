QFORGE_DEVICE_ID=mangmi-air-x-mq66b
QFORGE_DEVICE_NAME='MANGMI Air X MQ66B'
# Panel: BM5460BB1 (mangmi,bm5460bb1).
QFORGE_SOC_CLASS=SM6115

# MANGMI Air X — Snapdragon 662 (4x A73 + 4x A53, Adreno 610), 4 GB, eMMC + SD, no UFS. Three
# variants of one board that differ only in the panel (and the MQ66's SPI touch controller), so
# each has its own DTS and its own catalog row (boot/boards.map), and this conf is the same for
# all three bar the identity lines.
#
# One DSI link: the panel sits on mdss_dsi0 -> card0-DSI-1. 1080x1920 portrait native, 60 Hz only
# (all three panel drivers declare a single 60 Hz mode). NOT yet read off a device running
# QForge — taken from the panel drivers (kernel/patches/0565/0570/0575) and ROCKNIX's SM6115
# build, where the same DTS lights the same panel.
#
# The DTS panel declares rotation=<270>; gamescope reads that off the connector as before (no
# flag). The GRUB menu on this SoC wants rotation 90 rather than the fleet's 270 (ROCKNIX's SM6115
# GRUB_ROTATION), which boot/gen-grub-cfg.sh emits per saved board, keyed on the sm6115- DTB prefix.
QFORGE_PRIMARY_CONNECTOR=DSI-1
QFORGE_PANEL_NATIVE_WIDTH=1080
QFORGE_PANEL_NATIVE_HEIGHT=1920
QFORGE_PANEL_REFRESH_RATES=60
# 16:9 landscape -> the fleet's 177x100 density value (see defaults.conf). Not yet measured on
# this panel.
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Hardware map (hw-map). Detection gets the battery (power_supply/battery; bq256xx-battery is the
# charger's companion node and reports no capacity), the sgm41515 charger, the backlight, the
# gpu-thermal and battery zones and the gpio fan right. Pinned here: the CPU zone, because the
# board has one per core plus per-cluster ones and the A73 pair (cpu67) runs hottest; and the two
# nine-LED RGB rings around the sticks (leds-qcom-lpg multicolor devices rgb:l1-l9 / rgb:r1-r9;
# the left_*/right_* single-colour nodes are the same diodes' channels).
QFORGE_HW_THERMAL_CPU=cpu67-thermal
QFORGE_HW_LED_GROUPS="ring-left=rgb:l* ring-right=rgb:r*"

# Fan: a pwm-fan over a 100 Hz GPIO PWM (kernel/dts .../sm6115-mangmi-air-x-base.dtsi). Listening
# test 2026-10-11: still turning, very slowly, at 35% duty -> floor 90; off below 60 C, so the idle
# shell is silent (it used to be either off or full speed).
QFORGE_FAN_MIN_PWM=90
QFORGE_FAN_OFF_BELOW=60

# Stock scheduler only. scx_lavd on this SoC put one of two game threads on the A53s, which then
# missed 76-86% of its 60 fps deadlines under every governor (HW, Air X, 2026-10-10).
QFORGE_CPU_SCHEDULERS=none

# The shell renders at its design size and is scaled up (QFORGE_UI_VIEWPORT_RENDER): the Adreno
# 610 drew it at 37-39 fps at 1920x1080 and at 57 fps this way.
QFORGE_UI_VIEWPORT_RENDER=1

# Games and Steam get a 1280x720 display, scaled to the panel by the DPU plane: Steam's Big Picture
# ran at ~38 fps at 1920x1080 on the Adreno 610 (GPU 95% busy) and ~58 at 1280x720 (69%), and the
# plane scaled the 720x1280 pre-rotated copy for free (HW, Air X, 2026-10-10).
QFORGE_GAMESCOPE_NESTED_W=1280
QFORGE_GAMESCOPE_NESTED_H=720
