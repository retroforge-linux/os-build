QFORGE_DEVICE_ID=mangmi-air-y
QFORGE_DEVICE_NAME='MANGMI Air Y'
QFORGE_SOC_CLASS=SM6115

# MANGMI Air Y (sm6115-mangmi-air-y.dts, ROCKNIX `next` 2026-10-05): the Air X board — same SoC,
# PMIC, charger, gauge, codec + one AW88261 amp, serdev MCU joypad — behind a LANDSCAPE-NATIVE
# 1280x960 4:3 panel (mangmi,gh7005, kernel/patches/0585, one 60 Hz mode; the DTS deletes the base
# tree's rotation) with a Hynitron CST3530 touch controller (0739). Not yet booted on QForge.
#
# LANDSCAPE, like the Air Y Pro: qforge-session takes the native mode as the logical canvas, and
# boot/gen-grub-cfg.sh gives this board GRUB rotation 0 instead of SM6115's 90.
QFORGE_PANEL_ORIENTATION=landscape
QFORGE_PRIMARY_CONNECTOR=DSI-1
QFORGE_PANEL_NATIVE_WIDTH=1280
QFORGE_PANEL_NATIVE_HEIGHT=960
QFORGE_PANEL_REFRESH_RATES=60
# 4:3 -> 133x100 per defaults.conf. Not yet measured on this panel.
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=133x100

# Stock scheduler only. scx_lavd on this SoC put one of two game threads on the A53s, which then
# missed 76-86% of its 60 fps deadlines under every governor (HW, Air X, 2026-10-10).
QFORGE_CPU_SCHEDULERS=none
