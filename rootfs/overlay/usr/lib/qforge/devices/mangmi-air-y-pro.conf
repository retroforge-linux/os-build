QFORGE_DEVICE_ID=mangmi-air-y-pro
QFORGE_DEVICE_NAME='MANGMI Air Y Pro'
QFORGE_SOC_CLASS=SM8250

# MANGMI Air Y Pro (sm8250-mangmi-air-y-pro.dts), ported 2026-10-09 from ROCKNIX's SM8250 tree.
# Same SoC, PMICs, codec set and MCU joypad family as the Pocket Max; what differs is the display
# and touch: a LANDSCAPE-NATIVE 1280x960 4:3 panel (mangmi,air-y-pro-panel, kernel/patches/0580,
# one 60 Hz mode, no DTS rotation) on pm8150l WLED backlight + LCDB bias, and a Hynitron CST66xx
# touch controller (0736). Not yet booted on QForge; values from the panel driver and the DTS.
#
# LANDSCAPE: the first board in the fleet whose panel is not portrait. qforge-session normally
# swaps the native mode into landscape; QFORGE_PANEL_ORIENTATION=landscape tells it not to, and
# boot/gen-grub-cfg.sh gives this board GRUB rotation 0 for the same reason.
QFORGE_PANEL_ORIENTATION=landscape
QFORGE_PRIMARY_CONNECTOR=DSI-1
QFORGE_PANEL_NATIVE_WIDTH=1280
QFORGE_PANEL_NATIVE_HEIGHT=960
QFORGE_PANEL_REFRESH_RATES=60
# 4:3, so per defaults.conf hold the vertical 100 mm and derive the width: 133x100. Not yet
# measured on this panel.
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=133x100
