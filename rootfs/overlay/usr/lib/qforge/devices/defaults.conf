# qforge device-env defaults — sourced first, then overlaid by the matched
# <profile>.conf. An unrecognised board falls through with these values.
QFORGE_DEVICE_ID=unknown
QFORGE_DEVICE_NAME=unknown
QFORGE_SOC_CLASS=

QFORGE_PRIMARY_CONNECTOR=
QFORGE_PANEL_TYPE=internal
# portrait (every board but one): the panel's native mode is portrait and the device is held
# landscape, so qforge-session swaps native WIDTHxHEIGHT into the landscape logical canvas.
# landscape (MANGMI Air Y Pro): the panel is landscape-native, no swap, no scanout rotation.
QFORGE_PANEL_ORIENTATION=portrait
QFORGE_PANEL_NATIVE_WIDTH=
QFORGE_PANEL_NATIVE_HEIGHT=
QFORGE_PANEL_REFRESH_RATES=
# The UI scale lever (measured with SteamUI; OpenGamepadUI not yet re-measured), and the ONLY one — HW-confirmed on a Thor Lite: halving this doubles the
# reported DPI and the UI grows to match. It is a UI-DENSITY value, not a panel size: the fleet's
# 16:9 boards all declare 177x100 so every board lands at the same ~10.8 px/mm, and a non-16:9 board
# holds the vertical 100mm and derives its width. The panel's real mm (from the DRM connector, and
# now also from the synthesized EDID) do NOT drive scale — the Steam client stopped honouring them
# in 2026-07, which is when this was measured. Empty lets gamescope report the connector's own mm. Aspect-match it to the LANDSCAPE
# logical -W/-H, else the two axes disagree on DPI.
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=
# fake = fake-suspend (real suspend hangs these SoCs); mem = suspend-to-RAM.
QFORGE_SUSPEND_MODE=fake

# --- Hardware map (/usr/lib/qforge/hw-map -> /run/qforge/hw) ---------------------------------
# Names under /sys/class/{power_supply,backlight,hwmon,devfreq}, thermal zone TYPE names, and LED
# groups. Empty = hw-map detects it (first battery that reports a capacity, first charger with
# `online`, first backlight, zone types matching cpu/gpu/battery/skin, first hwmon with a fan,
# the *gpu* devfreq). Set one only where detection picks the wrong node on a board.
QFORGE_HW_BATTERY=
QFORGE_HW_CHARGER=
QFORGE_HW_BACKLIGHT=
QFORGE_HW_THERMAL_CPU=
QFORGE_HW_THERMAL_GPU=
QFORGE_HW_THERMAL_BATTERY=
QFORGE_HW_THERMAL_SKIN=
QFORGE_HW_FAN=
QFORGE_HW_GPU_DEVFREQ=
# "group=glob[,glob] ..." over /sys/class/leds, e.g. "ring-left=rgb:l* ring-right=rgb:r*"; each
# group becomes /run/qforge/hw/leds/<group>/01.. in natural order. Empty: "power=power-led" when
# that LED exists (the PM8550 boards), else no groups.
QFORGE_HW_LED_GROUPS=
