# qforge: the modem userspace only matters on SM6115 (MANGMI Air X), where the WCN3950 WLAN
# firmware runs on the modem DSP. The SM8250 boards expose a qcom_rmtfs_mem device too (their
# DTS carries the rmtfs reserved memory), which would satisfy upstream's ConditionPathExists and
# start a service for a modem those boards never boot. Gate on the SoC instead.
[Unit]
ConditionFirmware=device-tree-compatible(qcom,sm6115)
