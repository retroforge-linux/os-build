# retroforge: serve the tree msm-firmware-loader builds from this board's own partitions, and only
# where its persist has a sensors registry, which is what the sensors PD reads. A DSP without a
# sensors PD fails the attach every time; stop after five tries instead of retrying every 3 s.
#
# The ADSP has one FastRPC node, and the device tree decides which: /dev/fastrpc-adsp with
# qcom,non-secure-domain (sm8550.dtsi, sm8650.dtsi), /dev/fastrpc-adsp-secure without it (mainline's
# sm8750.dtsi, so the Odin 3 and the Pocket FIT ELITE). The driver lets the secure node attach the
# sensors PD too, so serve whichever is there; the unit's own condition wants the non-secure one and
# left the SM8750 boards without a sensors server. The empty ConditionPathExists= drops the unit's
# conditions (all of them, of any kind) and the lines after it put back the rest; the two with a
# leading | need only one of them to hold.
[Unit]
Wants=msm-firmware-loader-hexagonrpc.service
After=msm-firmware-loader-hexagonrpc.service
ConditionPathExists=
ConditionPathExists=!/dev/fastrpc-sdsp
ConditionPathExists=|/dev/fastrpc-adsp
ConditionPathExists=|/dev/fastrpc-adsp-secure
ConditionPathExists=/run/msm-firmware-loader/hexagonrpc/sensors/registry
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
ExecStart=
ExecStart=/bin/sh -c 'dev=/dev/fastrpc-adsp; [ -e $$dev ] || dev=/dev/fastrpc-adsp-secure; exec /usr/bin/hexagonrpcd -f $$dev -d adsp -s -R /run/msm-firmware-loader/hexagonrpc'
