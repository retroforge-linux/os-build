# retroforge: the SLPI's root PD server (packages/hexagonrpcd 0007), pulled in by
# hexagonrpcd-sdsp.service. It serves the same tree, under the same condition, so it runs only
# where the sensors server does.
[Unit]
Wants=msm-firmware-loader-hexagonrpc.service
After=msm-firmware-loader-hexagonrpc.service
ConditionPathExists=/run/msm-firmware-loader/hexagonrpc/sensors/registry
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -R /run/msm-firmware-loader/hexagonrpc
