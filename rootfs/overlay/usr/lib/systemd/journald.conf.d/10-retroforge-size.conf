# The journal stays under 1 GiB. /var/log is on /home, where journald's default is 10% of the
# filesystem, 4 GiB at most: 822 MB after six days on a dev MANGMI Air X ("max 4G" in its start line).
# A RETROFORGE_DEBUG build's 500M (/etc, 60-retroforge-debug.conf) still wins.
[Journal]
SystemMaxUse=1G
