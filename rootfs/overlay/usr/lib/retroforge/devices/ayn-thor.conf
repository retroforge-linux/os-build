RETROFORGE_DEVICE_ID=ayn-thor
RETROFORGE_DEVICE_NAME='AYN Thor'
RETROFORGE_SOC_CLASS=SM8550
# Kernel suspend-to-RAM (retroforge-suspend kernel_sleep), not the fake-suspend default.
RETROFORGE_SUSPEND_MODE=mem

RETROFORGE_PRIMARY_CONNECTOR=DSI-2
RETROFORGE_PANEL_NATIVE_WIDTH=1080
RETROFORGE_PANEL_NATIVE_HEIGHT=1920
RETROFORGE_PANEL_REFRESH_RATES=60,120
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# The bottom panel: ch13726a,thor on mdss_dsi0, so DSI-1 (the top icna3520 is on mdss_dsi1, DSI-2,
# HW-confirmed in 7c6850c) -- the Thor Lite's layout the other way round. Same panel as the Thor
# Lite's bottom one (1080x1240, mode read by gamescope off the connector). Touch: the FocalTech
# ft5452 is labelled "bottom_touchscreen" in qcs8550-ayn-thor.dts and patch 0705 makes that label
# its input device name. Read off the DTS, not yet off this board running RetroForge.
RETROFORGE_SECONDARY_CONNECTOR=DSI-1
RETROFORGE_SECONDARY_TOUCHSCREEN=bottom_touchscreen

# Hardware map (hw-map; docs/hardware-map.md has the per-SoC reasoning). Names read off this
# board's DTS and the drivers' naming, cross-checked with ROCKNIX `next`; not yet read off this
# board running RetroForge, so a wrong one is logged and detected instead.
# Backlight: two panels, each with its own DCS backlight named after its DSI device. The primary
# (top icna3520, DSI-2) is on mdss_dsi1, so ae96000.dsi.0; ae94000.dsi.0 is the bottom ch13726a
# screen, and it sorts first, so detection alone would take the wrong one. LEDs: the stick rings,
# as the Odin 2 Portal; power-led registers but ROCKNIX drives only the rings.
RETROFORGE_HW_BATTERY=qcom-battmgr-bat
RETROFORGE_HW_CHARGER=qcom-battmgr-usb
RETROFORGE_HW_BACKLIGHT=ae96000.dsi.0
RETROFORGE_HW_THERMAL_CPU=cpu7-top-thermal
RETROFORGE_HW_THERMAL_GPU=gpuss-0-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu
RETROFORGE_HW_LED_GROUPS="ring-left=rgb:l* ring-right=rgb:r*"
